packages:
  - apps/*
  - packages/*
  - plugins/*
  - tooling/*

catalog:
  '@vitejs/plugin-vue': ^6.0.4
  '@types/node': ^22.20.1
  '@types/react': ~18.3.31
  lightningcss: ^1.33.0
  react: ^18.3.1
  tsdown: ^0.22.14
  typescript: ^6.0.3
  vite: ^7.3.6
  vitest: ^3.2.0
  vue: ^3.5.28
  vue-tsc: ^3.2.5

disallowWorkspaceCycles: true
failIfNoMatch: true

# 第三方依赖的安装脚本默认不执行；新增项必须经过人工审查后显式加入。
allowBuilds:
  esbuild: true
  lightningcss: true
  msedge-tts: false
  workerd: true
